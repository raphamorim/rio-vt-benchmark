[package]
name = "rio-vt-benchmark"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Throughput comparison of rio-vt, vt100, alacritty_terminal and libghostty-vt"
repository = "https://github.com/raphamorim/rio-vt-benchmark"
publish = false

[dependencies]
rio-vt = "=0.5.0-alpha.4"
vt100 = "0.15"
alacritty_terminal = "0.26"
libghostty-vt = { git = "https://github.com/uzaaft/libghostty-rs", rev = "72ac98f292879bf9f788fcbb11238c562a1eebe6" }

[dev-dependencies]
criterion = { version = "0.6.0", features = ["html_reports"] }

[[bench]]
name = "snapshot"
harness = false

[[bench]]
name = "workloads"
harness = false

[[bench]]
name = "resize"
harness = false








