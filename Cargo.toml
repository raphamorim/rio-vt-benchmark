[package]
name = "rio-vt-benchmark"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Throughput comparison of rio-vt, vt100 and alacritty_terminal"
repository = "https://github.com/raphamorim/rio-vt-benchmark"
publish = false

[dependencies]
rio-vt = "=0.5.0-alpha.4"
vt100 = "0.15"
alacritty_terminal = "0.26"

[dev-dependencies]
criterion = { version = "0.6.0", features = ["html_reports"] }

[[bench]]
name = "snapshot"
harness = false

[[bench]]
name = "workloads"
harness = false

[[bench]]
name = "resize"
harness = false








